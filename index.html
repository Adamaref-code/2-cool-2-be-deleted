<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="create-chirp.css" />
		<link rel="stylesheet" href="style.css" />
		<title>Document</title>
		<script defer src="create-chirp.js"></script>
	</head>
	<body>
		<div class="gray-overlay" id="gray-overlay">
			<form class="chirp-form" id="chirp-form">
				<div class="chirp-form__top" id="chirp-form__top">
					<div
						class="chirp-form__username-and-image"
						id="chirp-form__username-and-image"
					>
						<image
							class="username"
							src="src/images/user-icon.svg"
							alt="an image respresentig a user icon"
						></image>
						<label class="hidden" for="author">Display name</label>
						<input id="author" name="author_name" placeholder="Your name" />
					</div>
					<button class="chirp-form__close" id="chirp-form__close">X</button>
				</div>
				<label class="hidden" for="message">Message</label>
				<textarea
					id="message"
					name="content"
					placeholder="What's happening?"
					required
					maxlength="280"
				></textarea>
				<hr />
				<div
					id="chirp-form__tag-mood-and-post"
					class="chirp-form__tag-mood-and-post"
				>
					<label class="hidden" for="tag">Tag, optional</label>
					<input id="tag" name="tag" placeholder="#tag" />
					<label class="hidden" for="select">Select your mood</label>
					<select id="mood" name="mood">
						<option value="Positive">positive</option>
						<option value="Negative">negative</option>
						<option value="Neutral" selected>neutral</option>
						<option value="Chaotic">chaotic</option>
					</select>
					<button id="submit_button" class="submit_button" type="submit">
						Post
					</button>
				</div>
			</form>
		</div>
	</body>
</html>
